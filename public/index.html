<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Roma</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa Roma">
<style>
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --bg2: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --label2: rgba(60, 60, 67, .6);
    --label3: rgba(60, 60, 67, .3);
    --sep: rgba(60, 60, 67, .18);
    --fill: rgba(120, 120, 128, .12);
    --red: #FF3B30;
    --blue: #007AFF;
    --green: #34C759;
    --bar: rgba(249, 249, 249, .86);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #000000;
      --bg2: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --label2: rgba(235, 235, 245, .6);
      --label3: rgba(235, 235, 245, .3);
      --sep: rgba(84, 84, 88, .65);
      --fill: rgba(118, 118, 128, .24);
      --red: #FF453A;
      --blue: #0A84FF;
      --green: #30D158;
      --bar: rgba(22, 22, 22, .86);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--label); font-family: var(--font);
    font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
  }
  body.grouped { background: var(--bg2); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .page { max-width: 820px; margin: 0 auto; padding: 8px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .muted { color: var(--label2); }
  .link { background: none; border: 0; color: var(--red); padding: 6px 4px; font-size: 17px; }
  .link.blue { color: var(--blue); }

  .login { max-width: 460px; margin: 0 auto; padding: 48px 20px 40px; }
  .login h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 0 0 6px; }
  .login .lead { color: var(--label2); margin: 0 0 32px; }
  .section-title { font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 26px 16px 7px; letter-spacing: .02em; }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .group > * + * { border-top: .5px solid var(--sep); }
  .name-opt { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 13px 16px; text-align: left; font-size: 17px; }
  .name-opt .check { margin-left: auto; color: var(--blue); font-weight: 600; visibility: hidden; }
  .name-opt[aria-checked="true"] .check { visibility: visible; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 15px; background: var(--c, #8E8E93); flex: none; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 18px 16px; }
  .swatch { aspect-ratio: 1; border-radius: 50%; border: 0; background: var(--c); position: relative; padding: 0; }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 5.5px var(--c); }
  .swatch:disabled { opacity: .28; cursor: not-allowed; }
  .swatch:disabled::after { content: ""; position: absolute; left: 50%; top: 12%; bottom: 12%; width: 2px; background: var(--card); transform: rotate(45deg); }
  .swatch-note { font-size: 13px; color: var(--label2); padding: 0 16px 14px; margin: 0; min-height: 1.3em; }
  .primary { display: block; width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 600; color: #fff; background: var(--c, var(--blue)); margin-top: 28px; }
  .primary:disabled { opacity: .4; cursor: default; }
  .error { color: var(--red); font-size: 15px; margin: 12px 4px 0; min-height: 1.2em; }

  .cal-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 10px 0 8px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
  .cal-top .year { color: var(--red); font-size: 17px; margin: 0 0 2px; }
  .cal-top h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .cal-top .nav { display: flex; align-items: center; gap: 2px; }
  .cal-top .nav .arrow { background: none; border: 0; color: var(--red); font-size: 26px; line-height: 1; padding: 4px 10px; }
  .dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; color: var(--label2); text-align: center; padding: 4px 0 6px; border-bottom: .5px solid var(--sep); }
  .dows .we { color: var(--label3); }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); touch-action: pan-y; }
  .cell { background: none; border: 0; border-bottom: .5px solid var(--sep); padding: 5px 1px 6px; min-height: 76px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; text-align: left; min-width: 0; }
  .cell .n { align-self: center; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; margin-bottom: 1px; }
  .cell.we .n { color: var(--label2); }
  .cell.out .n { color: var(--label3); }
  .cell.out .ev { opacity: .45; }
  .cell.today .n { color: var(--red); font-weight: 600; }
  .cell.sel .n { background: var(--label); color: var(--bg); font-weight: 600; }
  .cell.sel.today .n { background: var(--red); color: #fff; }
  .ev { font-size: 10.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: clip; border-radius: 4px; padding: 1px 3px; font-variant-numeric: tabular-nums; }
  .ev.pill { background: color-mix(in srgb, var(--c) 22%, transparent); color: color-mix(in srgb, var(--c) 62%, var(--label)); font-weight: 600; }
  .ev.pill.done { text-decoration: line-through; opacity: .6; }
  .ev.wake { display: flex; align-items: center; gap: 2px; padding: 0 2px; color: var(--label); }
  .ev.wake::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
  @media (min-width: 640px) {
    .cell { min-height: 104px; padding: 6px 3px; }
    .cell .n { align-self: flex-end; font-size: 16px; }
    .ev { font-size: 12px; padding: 1px 5px; }
  }

  .viewseg { margin: 2px 0 8px; }
  .viewseg .seg button { font-size: 13px; padding: 6px; }
  .wstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 2px 0 8px; border-bottom: .5px solid var(--sep); touch-action: pan-y; }
  .wstrip button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 2px 0; }
  .wstrip .g { font-size: 11px; color: var(--label2); text-transform: uppercase; }
  .wstrip .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  .wstrip .today .n { color: var(--red); font-weight: 600; }
  .wstrip .sel .n { background: var(--label); color: var(--bg); font-weight: 600; }
  .wstrip .sel.today .n { background: var(--red); color: #fff; }
  .wstrip .dots { display: flex; gap: 2px; height: 6px; }
  .wstrip .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
  .whead { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: .5px solid var(--sep); padding: 2px 0 6px; touch-action: pan-y; }
  .whead div { display: grid; justify-items: center; gap: 2px; }
  .whead .g { font-size: 11px; color: var(--label2); text-transform: uppercase; }
  .whead .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; }
  .whead .today .n { background: var(--red); color: #fff; font-weight: 600; }
  .wgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: .5px solid var(--sep); touch-action: pan-y; }
  .wcell { min-height: max(340px, calc(100vh - 380px)); border-left: .5px solid var(--sep); padding: 5px 2px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .wcell:first-child { border-left: 0; }
  .wcell.today { background: color-mix(in srgb, var(--red) 6%, transparent); }
  .wcell.past > * { opacity: .5; }
  .wcell .ev { font-size: 12px; padding: 3px 3px; }
  .wcell .ev.wake { padding: 2px 2px; }
  button.ev { border: 0; background: none; font-family: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; line-height: 1.2; }
  button.ev.pill { background: color-mix(in srgb, var(--c) 22%, transparent); }
  .ev.add { color: var(--blue); background: var(--fill) !important; text-align: center !important; font-weight: 600; border-radius: 5px; }
  .wlabel { display: none; }
  .wevs { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .ev .l { display: none; }
  @media (max-width: 639px) {
    .whead { display: none; }
    .wgrid { grid-template-columns: 1fr; border-top: .5px solid var(--sep); }
    .wcell { min-height: 0; border-left: 0; border-bottom: .5px solid var(--sep); flex-direction: row; align-items: flex-start; gap: 10px; padding: 8px 2px; }
    .wcell:last-child { border-bottom: 0; }
    .wcell.today { border-radius: 10px; }
    .wlabel { display: grid; justify-items: center; gap: 1px; width: 44px; flex: none; }
    .wlabel .g { font-size: 11px; color: var(--label2); text-transform: uppercase; }
    .wlabel .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; }
    .wcell.today .wlabel .n { background: var(--red); color: #fff; font-weight: 600; }
    .wevs { flex-direction: row; flex-wrap: wrap; flex: 1; gap: 6px; padding-top: 3px; }
    .wcell .ev { width: auto; font-size: 14px; padding: 5px 9px; border-radius: 8px; white-space: normal; }
    .wcell .ev.wake { background: var(--fill); padding: 5px 9px 5px 7px; gap: 5px; }
    .wcell .ev.wake::before { width: 8px; height: 8px; }
    .wcell .ev .l { display: inline; }
    .wcell .ev .s { display: none; }
    .wcell .ev.add { min-width: 36px; }
  }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--label2); margin: 12px 2px 0; }
  .cal-legend .chip { display: inline-flex; align-items: center; gap: 5px; }
  .cal-legend .chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  div.cell { cursor: pointer; }
  .wday { margin-top: 18px; scroll-margin-top: 120px; }
  .wday-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 7px; }
  .wday-head h3 { font-size: 17px; font-weight: 600; margin: 0; }
  .wday-head h3 .muted { font-weight: 400; }
  .wday.past { opacity: .55; }
  .wday.is-today h3 { color: var(--red); }
  .mini-add { border: 0; background: none; color: var(--blue); font-size: 15px; padding: 2px 4px; }
  .banner { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; background: var(--card); border-radius: 12px; padding: 12px 14px; margin: 10px 0; box-shadow: 0 0 0 .5px var(--sep) inset; }
  body:not(.grouped) .banner { background: var(--bg2); box-shadow: none; }
  @media (prefers-color-scheme: dark) { body:not(.grouped) .banner { background: var(--card); } }
  .banner .icon { font-size: 22px; flex: none; }
  .banner .text { flex: 1 1 220px; font-size: 15px; }
  .banner .text b { display: block; font-size: 16px; margin-bottom: 1px; }
  .banner .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .chipbtn { border: 0; border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 600; background: var(--fill); color: var(--blue); }
  .chipbtn.solid { background: var(--blue); color: #fff; }
  .chipbtn.red { color: var(--red); }

  .agenda { margin-top: 18px; }
  .agenda h2 { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
  .agenda h2 .muted { font-weight: 400; }
  .rows { background: var(--bg2); border-radius: 12px; overflow: hidden; }
  @media (prefers-color-scheme: dark) { .rows { background: var(--card); } }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 11px 14px; text-align: left; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 30px; right: 0; border-top: .5px solid var(--sep); }
  .row .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-size: 17px; }
  .row .sub { font-size: 14px; color: var(--label2); margin-top: 1px; }
  .row .right { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--label2); white-space: nowrap; }
  .row .right.strong { color: var(--label); font-weight: 600; }
  .row .chev { color: var(--label3); font-size: 20px; margin-left: 2px; }
  .row.add .title { color: var(--blue); }
  .empty { color: var(--label2); font-size: 15px; padding: 14px; margin: 0; }

  dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; background: var(--bg2); color: var(--label); border-radius: 14px 14px 0 0; max-height: 92vh; }
  @media (prefers-color-scheme: dark) { dialog.sheet { background: #1C1C1E; } dialog.sheet .group, dialog.sheet .rows { background: #2C2C2E; } }
  @media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 14px; } }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, .35); }
  .sheet-inner { padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 10px; }
  .sheet-head h3 { font-size: 17px; font-weight: 600; margin: 0; text-align: center; flex: 1; }
  .sheet-head .link { min-width: 72px; }
  .sheet-head .link.right { text-align: right; font-weight: 600; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto 4px; }
  .big-title { font-size: 28px; font-weight: 700; margin: 6px 0 2px; display: flex; align-items: center; gap: 10px; }
  .big-title .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; min-height: 44px; }
  .field label { flex: 1; }
  .time-big { font-size: 44px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: .01em; background: var(--fill); border: 0; border-radius: 12px; padding: 4px 14px; width: 100%; text-align: center; color: var(--label); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 7px; padding: 7px 6px; font-size: 14px; font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { background: #636366; } }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 12px; }
  .days button { border: 0; background: none; border-radius: 10px; padding: 6px 0; display: grid; gap: 2px; justify-items: center; font-size: 12px; color: var(--label2); }
  .days button b { font-size: 18px; font-weight: 500; color: var(--label); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
  .days button[aria-pressed="true"] b { background: var(--c); color: #fff; font-weight: 600; }
  .dowpick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px; }
  .dowpick button { aspect-ratio: 1; border-radius: 50%; border: 0; background: var(--fill); font-size: 15px; font-weight: 600; color: var(--label); padding: 0; }
  .dowpick button[aria-pressed="true"] { background: var(--c); color: #fff; }
  .stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 9px; overflow: hidden; }
  .stepper button { border: 0; background: none; width: 44px; height: 32px; font-size: 20px; color: var(--label); }
  .stepper button:disabled { color: var(--label3); }
  .stepper span { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .choice { display: block; width: 100%; background: none; border: 0; text-align: left; padding: 12px 16px; font-size: 17px; color: var(--red); }
  .switch { appearance: none; width: 51px; height: 31px; border-radius: 999px; background: var(--fill); position: relative; transition: background .2s; flex: none; margin: 0; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .switch:checked { background: var(--green); }
  .switch:checked::after { transform: translateX(20px); }
  .note { font-size: 13px; color: var(--label2); margin: 7px 16px 0; }
  .danger { width: 100%; background: var(--card); border: 0; color: var(--red); padding: 13px; border-radius: 12px; font-size: 17px; margin-top: 22px; }
  @media (prefers-color-scheme: dark) { .danger { background: #2C2C2E; } }
  .sheet .primary { margin-top: 22px; }
  @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }

  .large-title { font-size: 34px; font-weight: 700; margin: 14px 0 12px; }
  .add-row { display: flex; gap: 10px; align-items: center; padding: 8px 14px; }
  .add-row input { border: 0; background: none; padding: 6px 0; min-width: 0; }
  .add-row input[name="name"] { flex: 1; font-size: 17px; }
  .add-row input[name="qty"] { width: 84px; color: var(--label2); text-align: right; }
  .add-row .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; position: relative; }
  .item + .item::before, .add-row + .item::before { content: ""; position: absolute; top: 0; left: 50px; right: 0; border-top: .5px solid var(--sep); }
  .item .circle { appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label3); margin: 0; flex: none; cursor: pointer; display: grid; place-items: center; }
  .item .circle:checked { border-color: var(--c, var(--blue)); background: radial-gradient(circle, var(--c, var(--blue)) 54%, transparent 58%); }
  .item .what { flex: 1; min-width: 0; }
  .item .what .t { overflow-wrap: anywhere; }
  .item.done .what .t { color: var(--label2); }
  .item .what .s { font-size: 13px; color: var(--label2); }
  .item .del { border: 0; background: none; color: var(--label3); font-size: 22px; padding: 2px 6px; }

  .me-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 0 6px; }
  .me-card .avatar { width: 84px; height: 84px; font-size: 36px; }
  .me-card h2 { font-size: 26px; margin: 4px 0 0; }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding: 6px 0 calc(4px + env(safe-area-inset-bottom, 0px)); }
  .tabbar[hidden] { display: none; }
  .tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: #8E8E93; padding: 2px 18px; }
  .tabbar button[aria-current="page"] { color: var(--red); }
  .tabbar svg { width: 26px; height: 26px; }

  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(30, 30, 30, .92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div id="root"></div>

<nav class="tabbar" id="tabbar" hidden>
  <button data-go="calendario" aria-label="Calendario">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    Calendario
  </button>
  <button data-go="spesa" aria-label="Spesa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.3l2-7.5H6.3"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>
    Spesa
  </button>
  <button data-go="profilo" aria-label="Profilo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.3-3.6 4.2-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/></svg>
    Tu
  </button>
</nav>

<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------------------------------------------------------------------------
// Stato e utilità
// ---------------------------------------------------------------------------
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const MESI_LUNGHI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
const GIORNI = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const GIORNI_LUNGHI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const SCREENS = ['calendario', 'spesa', 'profilo'];

const state = {
  people: [], tasks: {}, palette: [], reminderHour: 23,
  profiles: [], shifts: [], requests: [], wake: [], items: [],
  me: '', screen: 'calendario', view: 'week', week: null, month: null, day: null, push: 'unknown',
  login: { person: '', color: '' }, sheet: null,
};
try { state.me = localStorage.getItem('turni-me') || ''; state.view = localStorage.getItem('turni-view') || 'week'; } catch {}

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => s.replace(/^./, (c) => c.toUpperCase());

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Errore di connessione, riprova.');
  return data;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

// date in formato 'YYYY-MM-DD', ora locale
const parse = (d) => { const [y, m, g] = d.split('-').map(Number); return new Date(y, m - 1, g); };
const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = parse(d); x.setDate(x.getDate() + n); return iso(x); };
const today = () => iso(new Date());
const firstOfMonth = (d) => d.slice(0, 8) + '01';
const addMonths = (m, n) => { const x = parse(m); x.setDate(1); x.setMonth(x.getMonth() + n); return iso(x); };
const mondayOf = (d) => addDays(d, -((parse(d).getDay() + 6) % 7));
const dayName = (d) => { const x = parse(d); return `${GIORNI_LUNGHI[x.getDay()]} ${x.getDate()} ${MESI[x.getMonth()]}`; };
const mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const shortTime = (t) => t.replace(/^0/, '');
function weekRange(ws) {
  const a = parse(ws), b = parse(addDays(ws, 6));
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${MESI[a.getMonth()]}`
    : `${a.getDate()} ${MESI[a.getMonth()]} – ${b.getDate()} ${MESI[b.getMonth()]}`;
}

// colori
const paletteById = (id) => state.palette.find((c) => c.id === id);
const colorOf = (person) => paletteById(state.profiles.find((p) => p.person === person)?.color)?.hex || '#8E8E93';
const takenBy = (colorId) => state.profiles.find((p) => p.color === colorId)?.person;

// dati del calendario
const wakeOf = (person, day) => state.wake.find((w) => w.person === person && w.day === day)?.time || '';
const shiftsOn = (day) => state.shifts.filter((s) => s.day === day).sort((a, b) => a.task.localeCompare(b.task));
const shiftById = (id) => state.shifts.find((s) => s.id === id);
const pendingFor = (shiftId) => state.requests.find((r) => r.status === 'in_attesa' && (r.from_shift_id === shiftId || r.to_shift_id === shiftId));
const taskShort = (task) => (task === 'bagno' ? 'Bagno' : 'Cucina');

// ---------------------------------------------------------------------------
// Navigazione
// ---------------------------------------------------------------------------
function screenFromHash() { const h = location.hash.slice(1); return SCREENS.includes(h) ? h : 'calendario'; }
state.screen = screenFromHash();

function go(screen) {
  state.screen = screen;
  history.replaceState(null, '', screen === 'calendario' ? location.pathname : '#' + screen);
  render();
  window.scrollTo(0, 0);
}

function render() {
  const loggedIn = state.me && state.profiles.some((p) => p.person === state.me);
  $('#tabbar').hidden = !loggedIn;
  if (!loggedIn) return renderLogin();
  document.querySelectorAll('#tabbar [data-go]').forEach((b) => {
    if (b.dataset.go === state.screen) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (state.screen === 'spesa') return renderSpesa();
  if (state.screen === 'profilo') return renderProfilo();
  return renderCalendario();
}

// ---------------------------------------------------------------------------
// Accesso
// ---------------------------------------------------------------------------
function renderLogin() {
  document.body.classList.add('grouped');
  const L = state.login;
  if (!L.person && state.me) L.person = state.me;
  const mine = state.profiles.find((p) => p.person === L.person);
  if (L.person && !L.color && mine) L.color = mine.color;
  const sel = paletteById(L.color);
  const owner = L.color && takenBy(L.color);

  $('#root').innerHTML = `<main class="login">
    <h1>Casa Roma</h1>
    <p class="lead">Entra con il tuo nome e scegli il tuo colore: è quello con cui ti vedranno le altre nel calendario.</p>

    <p class="section-title">Chi sei</p>
    <div class="group" role="radiogroup" aria-label="Il tuo nome">
      ${state.people.map((p) => `
        <button class="name-opt" role="radio" aria-checked="${L.person === p}" data-login-person="${p}">
          <span class="avatar" style="--c:${colorOf(p)}">${p[0]}</span>${p}<span class="check">✓</span>
        </button>`).join('')}
    </div>

    <p class="section-title">Il tuo colore</p>
    <div class="group">
      <div class="swatches" role="radiogroup" aria-label="Il tuo colore">
        ${state.palette.map((c) => {
          const who = takenBy(c.id);
          const blocked = who && who !== L.person;
          return `<button class="swatch" role="radio" style="--c:${c.hex}" aria-checked="${L.color === c.id}"
            aria-label="${c.name}${blocked ? `, già di ${who}` : ''}" title="${c.name}${blocked ? ` · già di ${who}` : ''}"
            data-login-color="${c.id}" ${blocked ? 'disabled' : ''}></button>`;
        }).join('')}
      </div>
      <p class="swatch-note">${sel ? `${sel.name}${owner && owner !== L.person ? ` · già di ${owner}` : ''}` : 'I colori sbarrati li ha già scelti qualcun’altra.'}</p>
    </div>

    <button class="primary" id="loginBtn" style="--c:${sel ? sel.hex : 'var(--blue)'}" ${L.person && L.color ? '' : 'disabled'}>Entra</button>
    <p class="error" id="loginError"></p>
  </main>`;
}

async function doLogin() {
  const { person, color } = state.login;
  $('#loginBtn').disabled = true;
  try {
    await api('/api/login', { method: 'POST', body: { person, color } });
    state.me = person;
    try { localStorage.setItem('turni-me', person); } catch {}
    state.profiles = await api('/api/profiles');
    state.login = { person: '', color: '' };
    await syncPush();
    await load();
    go('calendario');
  } catch (err) {
    state.profiles = await api('/api/profiles').catch(() => state.profiles);
    renderLogin();
    $('#loginError').textContent = err.message;
  }
}

// ---------------------------------------------------------------------------
// Calendario
// ---------------------------------------------------------------------------
function renderBanners() {
  const tom = addDays(today(), 1);
  let html = '';
  if (!wakeOf(state.me, tom)) {
    html += `<div class="banner"><span class="icon" aria-hidden="true">⏰</span>
      <span class="text"><b>A che ora ti svegli domani?</b>Va segnata entro le ${state.reminderHour}:00, se no arriva un promemoria.</span>
      <span class="acts"><button class="chipbtn solid" data-wake="${tom}">Segna</button></span></div>`;
  }
  for (const r of state.requests.filter((r) => r.status === 'in_attesa' && r.to_person === state.me)) {
    const a = shiftById(r.from_shift_id), b = shiftById(r.to_shift_id);
    if (!a || !b) continue;
    html += `<div class="banner"><span class="icon" aria-hidden="true">🔄</span>
      <span class="text"><b>${esc(r.from_person)} ti chiede uno scambio</b>Settimana ${weekRange(a.week_start)}: tu ${state.tasks[a.task]}, lei ${state.tasks[b.task]}.</span>
      <span class="acts"><button class="chipbtn" data-req="reject" data-id="${r.id}">Rifiuta</button>
      <button class="chipbtn solid" data-req="accept" data-id="${r.id}">Accetta</button></span></div>`;
  }
  return html;
}

function renderCalendario() {
  document.body.classList.remove('grouped');
  const t = today();
  if (!state.day) state.day = t;
  if (!state.month) state.month = firstOfMonth(state.day);
  if (!state.week) state.week = mondayOf(state.day);
  const isWeek = state.view === 'week';

  let year, title;
  if (isWeek) {
    const a = parse(state.week), b = parse(addDays(state.week, 6));
    year = b.getFullYear();
    title = a.getMonth() === b.getMonth() ? MESI_LUNGHI[a.getMonth()] : `${MESI_LUNGHI[a.getMonth()].slice(0, 3)} – ${MESI_LUNGHI[b.getMonth()].slice(0, 3)}`;
  } else {
    year = parse(state.month).getFullYear();
    title = MESI_LUNGHI[parse(state.month).getMonth()];
  }

  $('#root').innerHTML = `<main class="page">
    <header class="cal-top">
      <div><p class="year">${year}</p><h1>${title}</h1></div>
      <div class="nav">
        <button class="arrow" data-step="-1" aria-label="${isWeek ? 'Settimana precedente' : 'Mese precedente'}">‹</button>
        <button class="link" data-today>Oggi</button>
        <button class="arrow" data-step="1" aria-label="${isWeek ? 'Settimana successiva' : 'Mese successivo'}">›</button>
      </div>
    </header>
    <div class="viewseg"><div class="seg" role="group" aria-label="Vista">
      <button data-view="week" aria-pressed="${isWeek}">Settimana</button>
      <button data-view="month" aria-pressed="${!isWeek}">Mese</button>
    </div></div>
    ${renderBanners()}
    ${isWeek ? renderWeek() : renderMonth()}
  </main>`;
}

// eventi di un giorno, cliccabili direttamente nel calendario
function dayEvents(d, withAdd) {
  const t = today();
  const shifts = shiftsOn(d).map((s) => `<button class="ev pill ${s.done ? 'done' : ''}" style="--c:${colorOf(s.person)}" data-shift="${s.id}"
      aria-label="${state.tasks[s.task]}, ${s.person}"><span class="s">${taskShort(s.task)}</span><span class="l">${state.tasks[s.task]} · ${s.person}</span></button>`).join('');
  const wakes = state.people.map((p) => ({ p, v: wakeOf(p, d) })).filter((x) => x.v).sort((a, b) => a.v.localeCompare(b.v))
    .map(({ p, v }) => {
      const cls = 'ev wake';
      const label = `Sveglia ${p} ${v}`;
      return p === state.me && d >= t
        ? `<button class="${cls}" style="--c:${colorOf(p)}" data-wake="${d}" aria-label="${label}, modifica">${shortTime(v)}<span class="l">${p === state.me ? 'Tu' : p}</span></button>`
        : `<span class="${cls}" style="--c:${colorOf(p)}" aria-label="${label}">${shortTime(v)}<span class="l">${p}</span></span>`;
    }).join('');
  const add = withAdd && d >= t && !wakeOf(state.me, d)
    ? `<button class="ev add" data-wake="${d}" aria-label="Aggiungi la tua sveglia per ${dayName(d)}">+<span class="l"> Sveglia</span></button>` : '';
  return shifts + wakes + add;
}

function legend() {
  return `<div class="cal-legend">${state.people.map((p) => `<span class="chip" style="--c:${colorOf(p)}">${p}</span>`).join('')}
    <span>Tocca un turno o la tua sveglia per modificarli</span></div>`;
}

function renderWeek() {
  const t = today();
  const days = Array.from({ length: 7 }, (_, i) => addDays(state.week, i));
  const head = days.map((d) => `<div class="${d === t ? 'today' : ''}"><span class="g">${GIORNI[parse(d).getDay()]}</span><span class="n">${parse(d).getDate()}</span></div>`).join('');
  const cells = days.map((d) => `<div class="wcell ${d === t ? 'today' : ''} ${d < t ? 'past' : ''}" aria-label="${dayName(d)}">
    <div class="wlabel"><span class="g">${GIORNI[parse(d).getDay()]}</span><span class="n">${parse(d).getDate()}</span></div>
    <div class="wevs">${dayEvents(d, true)}</div></div>`).join('');
  return `<div class="whead">${head}</div><div class="wgrid" id="grid">${cells}</div>${legend()}`;
}

function renderMonth() {
  const t = today(), m = state.month, monthIdx = parse(m).getMonth();
  const start = mondayOf(m);
  const end = addDays(mondayOf(addDays(addMonths(m, 1), -1)), 6);
  let cells = '';
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const dow = parse(d).getDay();
    const cls = ['cell', d === t && 'today', parse(d).getMonth() !== monthIdx && 'out', (dow === 0 || dow === 6) && 'we'].filter(Boolean).join(' ');
    cells += `<div class="${cls}" data-day="${d}" aria-label="${dayName(d)}"><span class="n">${parse(d).getDate()}</span>${dayEvents(d, false)}</div>`;
  }
  return `<div class="dows">${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map((g, i) => `<span class="${i > 4 ? 'we' : ''}">${g}</span>`).join('')}</div>
    <div class="grid" id="grid">${cells}</div>${legend()}`;
}

// righe di un giorno: turni di pulizia e sveglie
function dayRows(d, withAdd) {
  const t = today();
  let rows = '';
  for (const s of shiftsOn(d)) {
    const sub = [s.person === state.me ? 'Tu' : s.person, s.done ? 'fatto ✓' : ''].filter(Boolean).join(' · ');
    rows += `<button class="row" data-shift="${s.id}">
      <span class="bar" style="--c:${colorOf(s.person)}"></span>
      <span class="main"><span class="title">🧽 ${state.tasks[s.task]}</span><span class="sub" style="display:block">${esc(sub)}</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </button>`;
  }
  const wakes = state.people.map((p) => ({ p, v: wakeOf(p, d) })).filter((x) => x.v).sort((a, b) => a.v.localeCompare(b.v));
  for (const { p, v } of wakes) {
    const mine = p === state.me;
    const editable = mine && d >= t;
    const tag = editable ? 'button' : 'div';
    const sub = editable ? 'Tocca per modificare o eliminare' : '';
    rows += `<${tag} class="row" ${editable ? `data-wake="${d}"` : ''}>
      <span class="bar" style="--c:${colorOf(p)}"></span>
      <span class="main"><span class="title">⏰ ${mine ? 'La tua sveglia' : `Sveglia ${esc(p)}`}</span>${sub ? `<span class="sub" style="display:block">${sub}</span>` : ''}</span>
      <span class="right">${v}</span>
      ${editable ? '<span class="chev" aria-hidden="true">›</span>' : ''}
    </${tag}>`;
  }
  if (withAdd && d >= t && !wakeOf(state.me, d)) {
    rows += `<button class="row add" data-wake="${d}"><span class="bar" style="--c:${colorOf(state.me)}"></span>
      <span class="main"><span class="title">Aggiungi la tua sveglia</span></span><span class="chev" aria-hidden="true">›</span></button>`;
  }
  return rows;
}

function step(n) {
  if (state.view === 'week') {
    state.week = addDays(state.week, 7 * n);
    state.day = state.week <= today() && today() <= addDays(state.week, 6) ? today() : state.week;
  } else {
    state.month = addMonths(state.month, n);
  }
  render();
}

// scorrimento con il dito (settimana o mese)
let touchX = null;
document.addEventListener('touchstart', (e) => { if (e.target.closest('#grid')) touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
}, { passive: true });

// ---------------------------------------------------------------------------
// Fogli: sveglia e turno
// ---------------------------------------------------------------------------
function openSheet(html) {
  const dlg = $('#sheet');
  dlg.innerHTML = `<div class="sheet-inner"><div class="grabber" aria-hidden="true"></div>${html}</div>`;
  if (!dlg.open) dlg.showModal();
}
function closeSheet() { $('#sheet').close(); }
$('#sheet').addEventListener('click', (e) => { if (e.target === $('#sheet')) closeSheet(); });
$('#sheet').addEventListener('close', () => { state.sheet = null; });

const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0]; // da lunedì a domenica
const DOW_LETTER = { 1: 'L', 2: 'M', 3: 'M', 4: 'G', 5: 'V', 6: 'S', 0: 'D' };

function openWake(day) {
  const prev = state.sheet && state.sheet.type === 'wake' && state.sheet.day === day ? state.sheet : null;
  state.sheet = prev || {
    type: 'wake', day, time: wakeOf(state.me, day), mode: 'one',
    dows: [parse(day).getDay()], weeks: 4, confirmDelete: false,
  };
  renderWakeSheet();
  if (!prev) setTimeout(() => $('#wakeTime')?.focus(), 50);
}

// giorni su cui verrà salvato l'orario
function wakeTargetDays(sh) {
  if (sh.mode === 'one') return [sh.day];
  if (sh.mode === 'weekly') return [0, 1, 2, 3].map((i) => addDays(sh.day, i * 7));
  const t = today(), monday = mondayOf(sh.day), out = [];
  for (let w = 0; w < sh.weeks; w++) {
    for (const dow of sh.dows) {
      const d = addDays(monday, w * 7 + ((dow + 6) % 7));
      if (d >= sh.day && d >= t) out.push(d);
    }
  }
  return out.sort();
}

// altri giorni futuri con lo stesso orario e lo stesso giorno della settimana (per eliminarli insieme)
function sameSeries(sh) {
  const v = wakeOf(state.me, sh.day), dow = parse(sh.day).getDay();
  return state.wake.filter((w) => w.person === state.me && w.time === v && w.day >= sh.day && parse(w.day).getDay() === dow)
    .map((w) => w.day).sort();
}

function renderWakeSheet() {
  const sh = state.sheet;
  const existing = wakeOf(state.me, sh.day);
  const c = colorOf(state.me);
  const targets = wakeTargetDays(sh);
  const series = existing ? sameSeries(sh) : [];
  const dowName = GIORNI_LUNGHI[parse(sh.day).getDay()];

  let repeat = `<p class="section-title">Ripeti</p>
    <div class="group"><div class="field"><div class="seg" style="width:100%" role="group" aria-label="Ripeti">
      <button aria-pressed="${sh.mode === 'one'}" data-mode="one">Solo questo</button>
      <button aria-pressed="${sh.mode === 'weekly'}" data-mode="weekly">Ogni ${GIORNI[parse(sh.day).getDay()]} · 4 sett.</button>
      <button aria-pressed="${sh.mode === 'multi'}" data-mode="multi">Giorni specifici</button>
    </div></div>`;
  if (sh.mode === 'multi') {
    repeat += `<div class="dowpick" style="--c:${c}" role="group" aria-label="Giorni della settimana">
        ${DOW_ORDER.map((d) => `<button aria-pressed="${sh.dows.includes(d)}" data-dow="${d}" aria-label="${GIORNI_LUNGHI[d]}">${DOW_LETTER[d]}</button>`).join('')}
      </div>
      <div class="field"><span>Per</span>
        <span class="stepper"><button data-weeks="-1" ${sh.weeks <= 1 ? 'disabled' : ''} aria-label="Una settimana in meno">−</button>
        <span>${sh.weeks}</span><button data-weeks="1" ${sh.weeks >= 12 ? 'disabled' : ''} aria-label="Una settimana in più">+</button></span>
        <span class="muted">${sh.weeks === 1 ? 'settimana' : 'settimane'}</span></div>`;
  }
  repeat += '</div>';
  const preview = sh.mode !== 'one'
    ? (targets.length
      ? `<p class="note">Verrà impostata su ${targets.length} ${targets.length === 1 ? 'giorno' : 'giorni'}: da ${dayName(targets[0])} a ${dayName(targets[targets.length - 1])}. I giorni che avevano già un orario vengono aggiornati.</p>`
      : '<p class="note">Scegli almeno un giorno della settimana.</p>')
    : `<p class="note">Da segnare entro le ${state.reminderHour}:00 del giorno prima. Le altre ricevono una notifica.</p>`;

  let del = '';
  if (existing) {
    if (!sh.confirmDelete) {
      del = '<button class="danger" data-del-wake>Elimina orario</button>';
    } else {
      del = `<p class="section-title">Elimina</p><div class="group">
        <button class="choice" data-del-scope="one">Solo ${dayName(sh.day)}</button>
        ${series.length > 1 ? `<button class="choice" data-del-scope="series">Tutti i ${dowName} da qui alle ${existing} (${series.length})</button>` : ''}
        <button class="choice" style="color:var(--blue)" data-del-scope="cancel">Annulla</button></div>`;
    }
  }

  openSheet(`
    <div class="sheet-head"><button class="link blue" data-close>Annulla</button><h3>${existing ? 'Modifica sveglia' : 'Nuova sveglia'}</h3>
      <button class="link blue right" data-save-wake>Salva</button></div>
    <div class="big-title"><span class="dot" style="--c:${c}"></span>${cap(dayName(sh.day))}</div>
    <p class="muted" style="margin:0 0 16px">${existing ? `Ora è segnata alle ${existing}` : 'A che ora ti svegli?'}</p>
    <input type="time" class="time-big" id="wakeTime" value="${sh.time}" aria-label="Orario di sveglia">
    ${repeat}
    ${preview}
    ${del}`);
}

async function saveWake() {
  const sh = state.sheet;
  sh.time = $('#wakeTime').value;
  if (!sh.time) { toast('Scegli un orario'); return; }
  const days = wakeTargetDays(sh);
  if (!days.length) { toast('Scegli almeno un giorno'); return; }
  try {
    await api('/api/wake/bulk', { method: 'PUT', body: { person: state.me, days, time: sh.time } });
    state.wake = [...state.wake.filter((w) => !(w.person === state.me && days.includes(w.day))), ...days.map((day) => ({ person: state.me, day, time: sh.time }))];
    closeSheet(); render();
    toast(days.length > 1 ? `Sveglia alle ${sh.time} per ${days.length} giorni` : `Sveglia alle ${sh.time}`);
  } catch (err) { toast(err.message); }
}

async function deleteWake(scope) {
  const sh = state.sheet;
  const days = scope === 'series' ? sameSeries(sh) : [sh.day];
  try {
    await api('/api/wake', { method: 'DELETE', body: { person: state.me, days } });
    state.wake = state.wake.filter((w) => !(w.person === state.me && days.includes(w.day)));
    closeSheet(); render();
    toast(days.length > 1 ? `Eliminati ${days.length} orari` : 'Orario eliminato');
  } catch (err) { toast(err.message); }
}

function openShift(id) {
  const s = shiftById(id);
  if (!s) return;
  state.sheet = { type: 'shift', id };
  const other = state.shifts.find((x) => x.week_start === s.week_start && x.id !== s.id);
  const free = state.people.find((p) => p !== s.person && p !== other?.person);
  const c = colorOf(s.person);
  openSheet(`
    <div class="sheet-head"><span style="min-width:72px"></span><h3>Turno di pulizia</h3><button class="link blue right" data-close>Fine</button></div>
    <div class="big-title"><span class="dot" style="--c:${c}"></span>${state.tasks[s.task]}</div>
    <p class="muted" style="margin:0 0 4px">${s.person === state.me ? 'Tocca a te' : `Tocca a ${esc(s.person)}`} · ${cap(dayName(s.day))}</p>
    <p class="muted" style="margin:0">Settimana ${weekRange(s.week_start)}${free ? ` · libera: ${esc(free)}` : ''}</p>

    <p class="section-title">Data</p>
    <div class="group"><div class="field"><label for="shiftDate">Giorno</label>
      <input type="date" id="shiftDate" value="${s.day}" style="border:0;background:var(--fill);border-radius:8px;padding:6px 10px"></div></div>

    <p class="section-title">Tipo di pulizia</p>
    <div class="group"><div class="field"><div class="seg" style="width:100%" role="group" aria-label="Tipo di pulizia">
      ${Object.entries(state.tasks).map(([k, label]) => `<button aria-pressed="${s.task === k}" data-type="${k}">${label}</button>`).join('')}
    </div></div></div>

    <p class="section-title">Assegnato a</p>
    <div class="group"><div class="field"><div class="seg" style="width:100%" role="group" aria-label="Assegnato a">
      ${state.people.map((p) => `<button aria-pressed="${s.person === p}" data-assign="${p}"><span style="color:${colorOf(p)}">●</span> ${p}</button>`).join('')}
    </div></div></div>
    <p class="note">Se scegli il tipo o la persona dell’altro turno della settimana${other ? ` (${esc(other.person)}, ${state.tasks[other.task]})` : ''}, i due turni si scambiano. Le altre ricevono una notifica.</p>

    <p class="section-title">Stato</p>
    <div class="group"><div class="field"><label for="doneSw">Fatto</label>
      <input type="checkbox" class="switch" id="doneSw" ${s.done ? 'checked' : ''}></div></div>`);
}

async function patchShift(id, body, msg) {
  try {
    const res = await api(`/api/shifts/${id}`, { method: 'PATCH', body: { person: state.me, ...body } });
    state.shifts = state.shifts.map((s) => res.shifts.find((u) => u.id === s.id) || s);
    if (body.day) { state.day = body.day; state.week = mondayOf(body.day); state.month = firstOfMonth(body.day); }
    openShift(res.focus);
    render();
    if (msg) toast(msg);
  } catch (err) { toast(err.message); openShift(id); }
}

// ---------------------------------------------------------------------------
// Modifica di una voce della spesa
// ---------------------------------------------------------------------------
function openItem(id) {
  const it = state.items.find((i) => i.id === id);
  if (!it) return;
  state.sheet = { type: 'item', id };
  openSheet(`
    <div class="sheet-head"><button class="link blue" data-close>Annulla</button><h3>Modifica</h3><button class="link blue right" data-save-item>Salva</button></div>
    <p class="section-title">Cosa</p>
    <div class="group"><div class="field"><input id="itemName" value="${esc(it.name)}" maxlength="80" aria-label="Nome" style="border:0;background:none;width:100%;font-size:17px"></div></div>
    <p class="section-title">Quantità</p>
    <div class="group"><div class="field"><input id="itemQty" value="${esc(it.qty || '')}" maxlength="30" placeholder="Es. 2 litri" aria-label="Quantità" style="border:0;background:none;width:100%;font-size:17px"></div></div>
    <button class="danger" data-del-item>Elimina dalla lista</button>`);
  setTimeout(() => $('#itemName')?.focus(), 50);
}

async function saveItem() {
  const id = state.sheet.id;
  const name = $('#itemName').value.trim(), qty = $('#itemQty').value.trim();
  if (!name) { toast('Scrivi cosa manca'); return; }
  try {
    const updated = await api(`/api/shopping/${id}`, { method: 'PATCH', body: { person: state.me, name, qty } });
    state.items = state.items.map((i) => (i.id === id ? updated : i));
    closeSheet(); render(); toast('Modificato');
  } catch (err) { toast(err.message); }
}

// ---------------------------------------------------------------------------
// Spesa
// ---------------------------------------------------------------------------
function itemRow(it) {
  const who = it.done ? it.done_by : it.added_by;
  const sub = [it.qty, it.done ? `preso da ${who}` : `aggiunto da ${who}`].filter(Boolean).join(' · ');
  return `<div class="item ${it.done ? 'done' : ''}">
    <input type="checkbox" class="circle" data-item="${it.id}" ${it.done ? 'checked' : ''} style="--c:${colorOf(who)}" aria-label="${esc(it.name)}">
    <button class="what" data-edit-item="${it.id}" style="background:none;border:0;padding:0;text-align:left" aria-label="Modifica ${esc(it.name)}"><span class="t">${esc(it.name)}</span><span class="s" style="display:block">${esc(sub)}</span></button>
    <button class="del" data-del="${it.id}" aria-label="Elimina ${esc(it.name)}">×</button>
  </div>`;
}

function renderSpesa() {
  document.body.classList.add('grouped');
  const todo = state.items.filter((i) => !i.done);
  const done = state.items.filter((i) => i.done);
  $('#root').innerHTML = `<main class="page">
    <h1 class="large-title">Spesa</h1>
    <div class="group">
      <form class="add-row" id="addForm" autocomplete="off">
        <span class="plus" aria-hidden="true">+</span>
        <input name="name" placeholder="Cosa manca?" maxlength="80" aria-label="Cosa manca" enterkeyhint="done">
        <input name="qty" placeholder="Quanto" maxlength="30" aria-label="Quantità">
      </form>
      ${todo.map(itemRow).join('')}
    </div>
    ${todo.length ? '' : '<p class="note">Non manca niente.</p>'}
    ${done.length ? `<div style="display:flex;justify-content:space-between;align-items:baseline">
        <p class="section-title">Già presi</p><button class="link blue" data-clear style="font-size:15px">Svuota</button></div>
      <div class="group">${done.map(itemRow).join('')}</div>` : ''}
  </main>`;
}

// ---------------------------------------------------------------------------
// Profilo
// ---------------------------------------------------------------------------
function pushRow() {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (state.push === 'on') {
    return `<div class="field"><span>Notifiche attive</span><span><button class="chipbtn" data-push="test">Prova</button></span></div>
      <div class="field"><span></span><button class="chipbtn red" data-push="off">Disattiva</button></div>`;
  }
  if (ios && !standalone) return `<div class="field"><span>Per le notifiche su iPhone: in Safari tocca Condividi → “Aggiungi alla schermata Home” e apri l’app da lì.</span></div>`;
  if (state.push === 'unsupported') return `<div class="field"><span>Questo browser non supporta le notifiche.</span></div>`;
  if (state.push === 'denied') return `<div class="field"><span>Notifiche bloccate: riattivale dalle impostazioni del telefono per questo sito.</span></div>`;
  return `<div class="field"><span>Notifiche</span><button class="chipbtn solid" data-push="on">Attiva</button></div>`;
}

function renderProfilo() {
  document.body.classList.add('grouped');
  const myColor = state.profiles.find((p) => p.person === state.me)?.color;
  $('#root').innerHTML = `<main class="page">
    <div class="me-card"><span class="avatar" style="--c:${colorOf(state.me)}">${state.me[0]}</span><h2>${esc(state.me)}</h2></div>

    <p class="section-title">Il tuo colore</p>
    <div class="group">
      <div class="swatches">${state.palette.map((c) => {
        const who = takenBy(c.id);
        const blocked = who && who !== state.me;
        return `<button class="swatch" style="--c:${c.hex}" aria-checked="${myColor === c.id}" aria-label="${c.name}${blocked ? `, già di ${who}` : ''}"
          data-mycolor="${c.id}" ${blocked ? 'disabled' : ''}></button>`;
      }).join('')}</div>
    </div>

    <p class="section-title">Avvisi</p>
    <div class="group">${pushRow()}</div>
    <p class="note">Ricevi un avviso quando le altre segnano la sveglia, quando ti chiedono uno scambio e alle ${state.reminderHour}:00 se non hai segnato la sveglia di domani.</p>

    <button class="danger" data-logout>Esci</button>
  </main>`;
}

// ---------------------------------------------------------------------------
// Notifiche push
// ---------------------------------------------------------------------------
const keyBytes = (b64) => {
  const raw = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
};
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
async function currentSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function syncPush() {
  if (!pushSupported()) { state.push = 'unsupported'; return; }
  if (Notification.permission === 'denied') { state.push = 'denied'; return; }
  const sub = await currentSub().catch(() => null);
  if (sub && Notification.permission === 'granted' && state.me) {
    state.push = 'on';
    await api('/api/push/subscribe', { method: 'POST', body: { person: state.me, subscription: sub.toJSON() } }).catch(() => {});
  } else state.push = 'off';
}
async function enablePush() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { state.push = perm === 'denied' ? 'denied' : 'off'; render(); return; }
  const reg = await navigator.serviceWorker.ready;
  const { key } = await api('/api/push/key');
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) });
  await api('/api/push/subscribe', { method: 'POST', body: { person: state.me, subscription: sub.toJSON() } });
  state.push = 'on'; toast('Notifiche attive'); render();
}
async function disablePush() {
  const sub = await currentSub();
  if (sub) { await api('/api/push/unsubscribe', { method: 'POST', body: { endpoint: sub.endpoint } }).catch(() => {}); await sub.unsubscribe(); }
  state.push = 'off'; toast('Notifiche disattivate'); render();
}

// ---------------------------------------------------------------------------
// Dati
// ---------------------------------------------------------------------------
async function load() {
  try {
    const [profiles, shifts, requests, wake, items] = await Promise.all([
      api('/api/profiles'), api('/api/shifts'), api('/api/requests'), api('/api/wake'), api('/api/shopping'),
    ]);
    Object.assign(state, { profiles, shifts, requests, wake, items });
    render();
    if (state.sheet?.type === 'shift') openShift(state.sheet.id);
  } catch (e) { toast(e.message); }
}

// aggiornamento automatico, senza disturbare chi sta scrivendo o ha un foglio aperto
setInterval(() => {
  const typing = document.activeElement && document.activeElement.matches('input, select, textarea');
  if (!document.hidden && !typing && !$('#sheet').open && state.me) load();
}, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.me && !$('#sheet').open) load(); });

// ---------------------------------------------------------------------------
// Eventi
// ---------------------------------------------------------------------------
$('#tabbar').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
window.addEventListener('hashchange', () => { state.screen = screenFromHash(); render(); });

$('#root').addEventListener('click', async (e) => {
  const el = (sel) => e.target.closest(sel);
  let b;
  // accesso
  if ((b = el('[data-login-person]'))) {
    state.login.person = b.dataset.loginPerson;
    const mine = state.profiles.find((p) => p.person === state.login.person);
    state.login.color = mine ? mine.color : (takenBy(state.login.color) && takenBy(state.login.color) !== state.login.person ? '' : state.login.color);
    return renderLogin();
  }
  if ((b = el('[data-login-color]'))) { state.login.color = b.dataset.loginColor; return renderLogin(); }
  if (el('#loginBtn')) return doLogin();

  // calendario
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if ((b = el('[data-wake]'))) return openWake(b.dataset.wake);
  if ((b = el('[data-shift]'))) return openShift(Number(b.dataset.shift));
  if ((b = el('[data-day]'))) {
    state.day = b.dataset.day;
    state.week = mondayOf(state.day);
    state.month = firstOfMonth(state.day);
    state.view = 'week';
    try { localStorage.setItem('turni-view', 'week'); } catch {}
    render();
    window.scrollTo({ top: 0, behavior: smooth });
    return;
  }
  if ((b = el('[data-step]'))) return step(Number(b.dataset.step));
  if ((b = el('[data-view]'))) {
    state.view = b.dataset.view;
    state.week = mondayOf(state.day); state.month = firstOfMonth(state.day);
    try { localStorage.setItem('turni-view', state.view); } catch {}
    return render();
  }
  if (el('[data-today]')) { state.day = today(); state.week = mondayOf(state.day); state.month = firstOfMonth(state.day); return render(); }
  if ((b = el('[data-edit-item]'))) return openItem(Number(b.dataset.editItem));
  if ((b = el('[data-wake]'))) return openWake(b.dataset.wake);
  if ((b = el('[data-shift]'))) return openShift(Number(b.dataset.shift));
  if ((b = el('[data-req]'))) return resolveReq(b);

  // spesa
  if ((b = el('[data-del]'))) {
    const id = Number(b.dataset.del);
    state.items = state.items.filter((i) => i.id !== id); render();
    return api(`/api/shopping/${id}`, { method: 'DELETE' }).catch((err) => toast(err.message));
  }
  if (el('[data-clear]')) {
    state.items = state.items.filter((i) => !i.done); render();
    return api('/api/shopping/clear-done', { method: 'POST' }).catch((err) => toast(err.message));
  }

  // profilo
  if ((b = el('[data-mycolor]'))) {
    try { await api('/api/login', { method: 'POST', body: { person: state.me, color: b.dataset.mycolor } }); state.profiles = await api('/api/profiles'); render(); }
    catch (err) { toast(err.message); }
    return;
  }
  if ((b = el('[data-push]'))) {
    b.disabled = true;
    try {
      if (b.dataset.push === 'on') await enablePush();
      else if (b.dataset.push === 'off') await disablePush();
      else { const sub = await currentSub(); await api('/api/push/test', { method: 'POST', body: { endpoint: sub && sub.endpoint } }); toast('Notifica di prova inviata'); }
    } catch (err) { toast(err.message || 'Non è stato possibile attivare le notifiche'); }
    b.disabled = false;
    return;
  }
  if (el('[data-logout]')) {
    if (state.push === 'on') await disablePush().catch(() => {});
    state.me = ''; try { localStorage.removeItem('turni-me'); } catch {}
    return render();
  }
});

async function resolveReq(b) {
  b.disabled = true;
  try {
    await api(`/api/requests/${b.dataset.id}/${b.dataset.req}`, { method: 'POST', body: { person: state.me } });
    toast({ accept: 'Scambio accettato: calendario aggiornato', reject: 'Richiesta rifiutata', cancel: 'Richiesta annullata' }[b.dataset.req]);
  } catch (err) { toast(err.message); }
  await load();
}

// foglio
$('#sheet').addEventListener('click', async (e) => {
  const el = (sel) => e.target.closest(sel);
  let b;
  if (el('[data-close]')) return closeSheet();
  if (el('[data-save-wake]')) return saveWake();
  if (state.sheet?.type === 'wake') {
    const sh = state.sheet;
    if ($('#wakeTime')) sh.time = $('#wakeTime').value;
    if ((b = el('[data-mode]'))) { sh.mode = b.dataset.mode; return renderWakeSheet(); }
    if ((b = el('[data-dow]'))) {
      const d = Number(b.dataset.dow);
      sh.dows = sh.dows.includes(d) ? sh.dows.filter((x) => x !== d) : [...sh.dows, d];
      return renderWakeSheet();
    }
    if ((b = el('[data-weeks]'))) { sh.weeks = Math.min(12, Math.max(1, sh.weeks + Number(b.dataset.weeks))); return renderWakeSheet(); }
    if (el('[data-del-wake]')) { sh.confirmDelete = true; return renderWakeSheet(); }
    if ((b = el('[data-del-scope]'))) {
      if (b.dataset.delScope === 'cancel') { sh.confirmDelete = false; return renderWakeSheet(); }
      return deleteWake(b.dataset.delScope);
    }
  }
  if ((b = el('[data-req]'))) { closeSheet(); return resolveReq(b); }
  if (state.sheet?.type === 'shift') {
    const id = state.sheet.id;
    if ((b = el('[data-type]'))) {
      if (b.dataset.type !== shiftById(id).task) await patchShift(id, { task: b.dataset.type }, 'Tipo di pulizia cambiato');
      return;
    }
    if ((b = el('[data-assign]'))) {
      if (b.dataset.assign !== shiftById(id).person) await patchShift(id, { assignee: b.dataset.assign }, `Ora tocca a ${b.dataset.assign}`);
      return;
    }
  }
  if (state.sheet?.type === 'item') {
    if (el('[data-save-item]')) return saveItem();
    if (el('[data-del-item]')) {
      const id = state.sheet.id;
      closeSheet();
      state.items = state.items.filter((i) => i.id !== id); render();
      return api(`/api/shopping/${id}`, { method: 'DELETE' }).then(() => toast('Eliminato')).catch((err) => toast(err.message));
    }
  }
});
$('#sheet').addEventListener('change', async (e) => {
  if (state.sheet?.type !== 'shift') return;
  if (e.target.id === 'doneSw') return patchShift(state.sheet.id, { done: e.target.checked });
  if (e.target.id === 'shiftDate' && e.target.value) return patchShift(state.sheet.id, { day: e.target.value }, `Spostato a ${dayName(e.target.value)}`);
});
$('#sheet').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'wakeTime') { e.preventDefault(); saveWake(); }
  if (e.target.id === 'itemName' || e.target.id === 'itemQty') { e.preventDefault(); saveItem(); }
});

// spesa: aggiunta e spunta
$('#root').addEventListener('submit', async (e) => {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  const f = e.target;
  const name = f.elements.namedItem('name').value.trim(), qty = f.elements.namedItem('qty').value.trim();
  if (!name) return;
  try {
    const item = await api('/api/shopping', { method: 'POST', body: { person: state.me, name, qty } });
    state.items = [item, ...state.items.filter((i) => i.id !== item.id)];
    render();
    $('#addForm input[name="name"]').focus();
  } catch (err) { toast(err.message); }
});
$('#root').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.closest('#addForm')) { e.preventDefault(); e.target.closest('#addForm').requestSubmit(); }
});
$('#root').addEventListener('change', async (e) => {
  const id = Number(e.target.dataset.item);
  if (!id) return;
  const done = e.target.checked;
  const it = state.items.find((i) => i.id === id);
  if (it) Object.assign(it, { done, done_by: done ? state.me : null });
  render();
  try {
    const updated = await api(`/api/shopping/${id}`, { method: 'PATCH', body: { person: state.me, done } });
    state.items = state.items.map((i) => (i.id === id ? updated : i));
  } catch (err) { toast(err.message); await load(); }
});

// ---------------------------------------------------------------------------
// Avvio
// ---------------------------------------------------------------------------
(async () => {
  try {
    const cfg = await api('/api/config');
    Object.assign(state, { people: cfg.people, tasks: cfg.tasks, palette: cfg.palette, reminderHour: cfg.reminderHour });
    if (state.me && !state.people.includes(state.me)) state.me = '';
  } catch (e) { $('#root').innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
  if ('serviceWorker' in navigator) await navigator.serviceWorker.register('/sw.js').catch(() => {});
  await syncPush();
  if (state.me) await load();
  else { state.profiles = await api('/api/profiles').catch(() => []); render(); }
})();
</script>
</body>
</html>
